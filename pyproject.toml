[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x2-revive-server"
version = "0.1.0"
description = "Offline protocol compatibility research for the X2 Android client"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Research-only; see LICENSE_NOTICE.md" }
authors = [{ name = "X2 preservation contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tools"]
exclude = ["tests/fixtures"]

